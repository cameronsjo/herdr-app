# FORK(sync-guard): a required check (ruleset 27338965) that fails a PR that
# would merge without a person and touches the files that decide what runs on
# Cameron's Macs or what agents and the sync routine do (agent configuration
# at any depth: CLAUDE.md, CLAUDE.local.md, .claude/). Auto-merge then waits
# on it; Cameron reads such a PR and merges with the admin bypass. Fork-only file.
#
# Would merge without a person: auto-merge is on (any branch, any title; the
# check runs again when auto-merge is turned on or off), or by name: the head
# branch is sync/* (scripts/fork/sync-upstream) or claude/* (cloud sessions,
# the weekly routine included), the title says it syncs upstream, or the head
# is in another repository. A PR changing 3000 or more files fails outright:
# the files API lists at most 3000, so the check could not see them all.
#
# pull_request_target, so the job that runs is master's copy of this file, and
# it checks out nothing and runs no code from the PR. Reported by GitHub Actions
# alone, it catches accidents, not a hostile change: a workflow in a same-repo
# PR can report a job of the same name. So once the fork's own GitHub App is set
# up (docs/fork/sync-paths-app.md), the result is also posted as that App's
# `sync-paths` check run, and the ruleset requires the App's. Its key lives in
# the `sync-paths-app` environment, which only master may deploy to, so no PR
# workflow can read it (docs/fork/weekly-sync.md § Trust).
name: fork-sync-paths

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, auto_merge_enabled, auto_merge_disabled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: sync-paths-app
    steps:
      - name: PRs that merge without a person leave the protected paths alone
        id: rules
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTO_MERGE: ${{ github.event.pull_request.auto_merge != null }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          # Untrusted text: read from the environment, never spliced into the script.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          # The App's check run shows the same text (the report step below).
          exec > >(tee -a "$RUNNER_TEMP/sync-paths.txt") 2>&1
          if [[ ! $CHANGED_FILES =~ ^[0-9]+$ ]] || (( CHANGED_FILES >= 3000 )); then
            echo "::error::This PR changes ${CHANGED_FILES} files; the files API lists at most 3000, so this check cannot see them all. Split it, or Cameron merges it with the admin bypass." >&2
            exit 1
          fi
          why=''
          if [[ $AUTO_MERGE == true ]]; then why="auto-merge is on"; fi
          if [[ -z $why ]]; then
            case $HEAD_REF in sync/* | claude/*) why="head branch $HEAD_REF" ;; esac
          fi
          shopt -s nocasematch
          if [[ -z $why && $TITLE == *"sync upstream"* ]]; then why="title says it syncs upstream"; fi
          shopt -u nocasematch
          if [[ -z $why && $HEAD_REPO != "$REPO" ]]; then why="head is in $HEAD_REPO"; fi
          if [[ -z $why ]]; then echo "a person merges this PR: nothing to check"; exit 0; fi
          # Both names of a renamed file count: moving a protected file out is a change to it.
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          hit=()
          while IFS= read -r f; do
            case $f in
              # Agent configuration at any depth: a nested CLAUDE.md or .claude/skills loads into sessions too.
              scripts/fork/* | .github/* | .mcp.json | docs/fork/weekly-sync.md | \
              CLAUDE.md | */CLAUDE.md | CLAUDE.local.md | */CLAUDE.local.md | .claude/* | */.claude/*) hit+=("$f") ;;
            esac
          done <<<"$files"
          if [[ ${#hit[@]} -eq 0 ]]; then echo "merges without a person ($why), but no protected path touched"; exit 0; fi
          {
            echo "::error::This PR would merge without a person ($why) and changes protected paths. Turn auto-merge off; Cameron reviews it and merges with the admin bypass:"
            printf '  %s\n' "${hit[@]}"
          } >&2
          exit 1

      # As the fork's App, which a PR's workflow can't post as. Skipped until
      # SYNC_PATHS_APP_ID is set; the key is read by this step alone.
      - name: Post the result as the sync-paths App
        if: ${{ always() && vars.SYNC_PATHS_APP_ID != '' }}
        env:
          APP_ID: ${{ vars.SYNC_PATHS_APP_ID }}
          APP_KEY: ${{ secrets.SYNC_PATHS_APP_KEY }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUTCOME: ${{ steps.rules.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ -n $APP_KEY ]] || { echo "::error::SYNC_PATHS_APP_KEY is not in the sync-paths-app environment"; exit 1; }
          key=$RUNNER_TEMP/app.pem
          (umask 077; printf '%s\n' "$APP_KEY" > "$key")
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          header=$(printf '{"alg":"RS256","typ":"JWT"}' | b64)
          payload=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now - 60)) $((now + 540)) "$APP_ID" | b64)
          sig=$(printf '%s.%s' "$header" "$payload" | openssl dgst -sha256 -sign "$key" -binary | b64)
          rm -f "$key"
          jwt="$header.$payload.$sig"
          api() { curl -fsS -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }
          inst=$(api -H "Authorization: Bearer $jwt" "https://api.github.com/repos/$REPO/installation" | jq -r .id)
          # A token for this repo only, allowed to write check runs and nothing else.
          token=$(api -X POST -H "Authorization: Bearer $jwt" "https://api.github.com/app/installations/$inst/access_tokens" \
            -d "$(jq -nc --arg r "${REPO#*/}" '{repositories: [$r], permissions: {checks: "write"}}')" | jq -r .token)
          echo "::add-mask::$token"
          conclusion=failure
          [[ $OUTCOME == success ]] && conclusion=success
          text=$(tail -c 60000 "$RUNNER_TEMP/sync-paths.txt" 2>/dev/null || true)
          jq -n --arg sha "$HEAD_SHA" --arg c "$conclusion" --arg url "$RUN_URL" --arg text "$text" \
            '{name: "sync-paths", head_sha: $sha, status: "completed", conclusion: $c, details_url: $url,
              output: {title: ("sync-paths: " + $c), summary: "Protected paths on PRs that merge without a person (.github/workflows/fork-sync-paths.yml).", text: ("```\n" + $text + "\n```")}}' |
            api -X POST -H "Authorization: Bearer $token" "https://api.github.com/repos/$REPO/check-runs" -d @- >/dev/null
          echo "posted sync-paths: $conclusion as app $APP_ID"

      - name: Fail when the rules failed
        if: ${{ always() && steps.rules.outcome != 'success' }}
        run: exit 1

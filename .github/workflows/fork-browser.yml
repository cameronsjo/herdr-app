# FORK(browser): the browser build's tests on macOS. Upstream's ci.yml builds
# the default features only, and `browser-pane` compiles only on macOS, so a
# sync PR that breaks the browser fails here, not on Cameron's Mac. Fork-only
# file: upstream syncs never conflict on it. Steps mirror ci.yml's macOS job.
name: fork-browser

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.95.0
  ZIG_VERSION: 0.16.0
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"
  CARGO_INCREMENTAL: "0"
  SAVE_CACHES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

jobs:
  browser-webkit:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &cache-paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: fork-browser-v1-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**', 'crates/**', '.github/workflows/fork-browser.yml') }}
          restore-keys: fork-browser-v1-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-
      - name: Keep unchanged sources fresh
        run: scripts/ci-sources restore
      - name: Build tests
        run: cargo test --locked --features browser-webkit --config 'profile.dev.package."*".opt-level=0' --no-run
      - name: Note the sources the cache was built from
        if: env.SAVE_CACHES == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: scripts/ci-sources record
      - name: Save build cache
        if: env.SAVE_CACHES == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *cache-paths
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Tests
        run: cargo test --locked --features browser-webkit --config 'profile.dev.package."*".opt-level=0' --bins
